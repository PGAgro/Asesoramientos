<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4A34">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asesoramiento">
<title>Asesoramiento Agronómico</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#1F2A22; --green:#2F4A34; --sage:#6B8F6E; --amber:#E4BE7A;
    --paper:#F2F0E4; --bg:#FBFAF6; --bad:#B4442E; --line:#E3E0D3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Poppins','Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:78px;}

  header{position:sticky; top:0; z-index:20; background:var(--green); color:var(--paper); padding:14px 18px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 10px rgba(0,0,0,.12);}
  header b{font-weight:800; font-size:17px;}
  header .sub{font-size:11px; color:var(--amber);}
  header .today{margin-left:auto; text-align:right; font-size:10px; color:var(--paper); opacity:.9;}

  main{padding:16px 16px 8px;}
  .view{display:none;} .view.active{display:block;}
  h1.page-title{font-size:15px; font-weight:700; margin:4px 0 14px; color:var(--green);}

  .card{background:var(--paper); border-radius:16px; padding:15px; margin-bottom:11px; border:1px solid var(--line); cursor:pointer;}
  .card b{font-size:14.5px; color:var(--ink); display:block;}
  .card .sub{font-size:12px; color:#6B8F6E; margin-top:2px;}
  .card .meta{font-size:11.5px; color:#8A8672; margin-top:5px;}

  .btn{appearance:none; border:none; cursor:pointer; border-radius:12px; font-family:inherit; font-weight:600; font-size:13.5px; padding:11px 16px;}
  .btn-primary{background:var(--green); color:var(--paper); width:100%;}
  .btn-outline{background:transparent; color:var(--green); border:1.5px solid var(--green); width:100%;}
  .btn-small{padding:7px 12px; font-size:12px; border-radius:9px; width:auto;}
  .btn-dictando{background:var(--bad); color:#fff; border-color:var(--bad);}
  .fab{position:fixed; bottom:92px; right:max(16px, calc(50vw - 240px + 16px)); width:52px; height:52px; border-radius:50%; background:var(--amber); color:var(--ink); font-size:26px; border:none; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; z-index:25;}

  label.field-label{display:block; font-size:12px; font-weight:600; color:var(--green); margin:14px 0 5px;}
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%; font-family:inherit; font-size:14px; color:var(--ink); background:#fff;
    border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  textarea{min-height:80px; resize:vertical;}
  .hint{font-size:11px; color:#8A8672; margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .empty{text-align:center; padding:36px 20px; color:#8A8672; font-size:13px;}
  .empty b{display:block; color:var(--ink); font-size:14px; margin-bottom:4px;}

  nav.tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line); display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom);}
  nav.tabbar button{flex:1; background:none; border:none; font-family:inherit; cursor:pointer; padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:#B9B6A8; font-size:10.5px; font-weight:600;}
  nav.tabbar button .ic{font-size:19px; line-height:1;}
  nav.tabbar button.active{color:var(--green);}

  .modal-overlay{position:fixed; inset:0; background:rgba(31,42,34,.45); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--bg); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px 18px 26px; max-height:90vh; overflow-y:auto;}
  .modal-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--green); background:none; border:none; cursor:pointer; padding:0 0 12px; font-family:inherit;}

  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:30px; font-size:12.5px; font-weight:600; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s;}
  .toast.show{opacity:1;}

  .sec-head{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px;}
  .sec-head span{font-size:12px; font-weight:700; color:var(--sage); text-transform:uppercase; letter-spacing:.5px;}
  .pill{display:inline-block; font-size:10.5px; font-weight:700; background:var(--amber); color:var(--ink); border-radius:20px; padding:2px 8px; margin-left:6px; vertical-align:middle;}

  .filter-row{display:flex; gap:8px; margin-bottom:12px;}
  .filter-row select{font-size:12.5px; padding:9px 8px;}

  /* Informe imprimible */
  .informe{background:#fff; border-radius:14px; padding:20px; border:1px solid var(--line);}
  .informe h2{font-size:17px; color:var(--green); margin:0 0 2px;}
  .informe .meta{font-size:12px; color:#6B8F6E; margin-bottom:14px;}
  .informe .bloque{margin-bottom:14px;}
  .informe .bloque h3{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--sage); margin:0 0 4px;}
  .informe .bloque p{font-size:13.5px; line-height:1.5; margin:0; white-space:pre-wrap;}

  @media print{
    header, nav.tabbar, .fab, .btn, .back-link, .modal-handle{display:none !important;}
    .modal-overlay{position:static !important; background:none !important; display:block !important;}
    .modal{max-height:none !important; overflow:visible !important; box-shadow:none !important; border-radius:0 !important; padding:0 !important;}
    body{background:#fff;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="app">

  <div id="loginScreen" style="position:fixed; inset:0; z-index:100; background:var(--green); display:flex; align-items:center; justify-content:center; padding:24px;">
    <div style="max-width:340px; width:100%;">
      <div style="text-align:center; color:var(--paper); font-weight:800; font-size:19px; margin-bottom:2px;">Asesoramiento Agronómico</div>
      <div style="text-align:center; color:var(--amber); font-size:12px; margin-bottom:22px;">Recorridas, potreros y recomendaciones</div>
      <div style="background:var(--paper); border-radius:16px; padding:18px;">
        <div style="display:flex; gap:6px; margin-bottom:14px;">
          <button type="button" id="tabLogin" class="btn btn-small" style="flex:1; background:var(--green); color:var(--paper);" onclick="mostrarTab('login')">Iniciar sesión</button>
          <button type="button" id="tabRegistro" class="btn btn-small" style="flex:1; background:transparent; color:var(--green); border:1.5px solid var(--green);" onclick="mostrarTab('registro')">Crear cuenta</button>
        </div>
        <div id="bloqueLogin">
          <label class="field-label" style="margin-top:0;">Email</label>
          <input type="text" id="li_email" placeholder="tu@email.com">
          <label class="field-label">Contraseña</label>
          <input type="password" id="li_pass" placeholder="••••••••">
          <button class="btn btn-primary" style="margin-top:14px;" onclick="hacerLogin()">Entrar</button>
        </div>
        <div id="bloqueRegistro" style="display:none;">
          <label class="field-label" style="margin-top:0;">Nombre y apellido</label>
          <input type="text" id="re_nombre" placeholder="Como te van a ver en la app">
          <label class="field-label">Email</label>
          <input type="text" id="re_email" placeholder="tu@email.com">
          <label class="field-label">Contraseña</label>
          <input type="password" id="re_pass" placeholder="Mínimo 6 caracteres">
          <button class="btn btn-primary" style="margin-top:14px;" onclick="hacerRegistro()">Crear cuenta y entrar</button>
        </div>
        <div id="loginError" class="hint" style="color:#B4442E; margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <div id="mainScreen" style="display:none;">

    <header>
      <div>
        <b>Asesoramiento</b>
        <div class="sub">Agronómico</div>
      </div>
      <div class="today" id="connStatus">🟡 Conectando…</div>
    </header>

    <main>
      <!-- ===================== CLIENTES ===================== -->
      <section class="view active" id="view-clientes">
        <h1 class="page-title">Clientes</h1>
        <div id="clientesList"></div>
      </section>

      <!-- ===================== POTREROS ===================== -->
      <section class="view" id="view-potreros">
        <h1 class="page-title">Potreros</h1>
        <div class="filter-row">
          <select id="filtroClientePotreros" onchange="renderPotreros()" style="flex:1;"><option value="">Todos los clientes</option></select>
        </div>
        <div id="potrerosList"></div>
      </section>

      <!-- ===================== HISTORIAL ===================== -->
      <section class="view" id="view-historial">
        <h1 class="page-title">Historial</h1>
        <div class="filter-row">
          <button class="btn btn-small" id="tabHistRecorridas" style="flex:1; background:var(--green); color:var(--paper);" onclick="cambiarTabHistorial('recorridas')">Recorridas</button>
          <button class="btn btn-small" id="tabHistOrdenes" style="flex:1; background:transparent; color:var(--green); border:1.5px solid var(--green);" onclick="cambiarTabHistorial('ordenes')">Órdenes de aplicación</button>
        </div>
        <div class="filter-row">
          <select id="filtroClienteHist" onchange="renderHistorial()"><option value="">Todos los clientes</option></select>
          <select id="filtroPotreroHist" onchange="renderHistorial()"><option value="">Todos los potreros</option></select>
        </div>
        <div id="historialList"></div>
      </section>
    </main>

    <button class="fab" id="fabBtn" onclick="fabAction()">+</button>

    <nav class="tabbar">
      <button class="tab-btn active" data-view="clientes" onclick="showView('clientes')"><span class="ic">👤</span>CLIENTES</button>
      <button class="tab-btn" data-view="potreros" onclick="showView('potreros')"><span class="ic">🌾</span>POTREROS</button>
      <button class="tab-btn" data-view="historial" onclick="showView('historial')"><span class="ic">🕘</span>HISTORIAL</button>
    </nav>

    <div class="modal-overlay" id="formOverlay"><div class="modal" id="formModal"></div></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script type="module">
/* =========================================================
   CONFIGURACIÓN DE FIREBASE
   =========================================================
   Podés reutilizar el MISMO proyecto de Firebase que ya
   configuraste para la app de Chequeos de PGAgro (pegá el
   mismo objeto firebaseConfig acá abajo) — esta app usa
   colecciones distintas ("clientes", "potreros", "recorridas"),
   así que no pisa nada de la otra app aunque compartan proyecto.
   Si preferís mantenerlas separadas, creá un proyecto nuevo
   siguiendo los mismos pasos que ya hicimos antes.
   Además de Firestore, esta versión usa Firebase Storage para
   guardar las fotos. Un paso extra en la configuración:
   7. En el menú izquierdo: Compilación → Storage → "Comenzar" →
      aceptá el modo producción → misma región que elegiste antes.
   8. Pestaña "Rules" de Storage → pegá esto → Publicar:
      rules_version = '2';
      service firebase.storage {
        match /b/{bucket}/o {
          match /{allPaths=**} {
            allow read, write: if request.auth != null;
          }
        }
      }
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCtENFVRpESM_3CByQtf0xSmWDPOiVF8x8",
  authDomain: "pgagro--asesoramientos.firebaseapp.com",
  projectId: "pgagro--asesoramientos",
  storageBucket: "pgagro--asesoramientos.firebasestorage.app",
  messagingSenderId: "774716962844",
  appId: "1:774716962844:web:32afe90165218896ff07d9"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentSingleTabManager,
  collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  updateProfile, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const fbApp = initializeApp(firebaseConfig);
// Cache local persistente: permite leer y escribir sin conexión.
// Las escrituras (recorridas, potreros, etc.) quedan en cola en el celular
// y se sincronizan solas apenas vuelve a haber señal — sin perder nada.
const db = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentSingleTabManager({}) })
});
const storage = getStorage(fbApp);
// Sin señal, una subida de archivo reintenta por defecto durante 10 minutos.
// Con 20 segundos falla rápido y la app puede avisar en vez de quedar colgada.
storage.maxUploadRetryTime = 20000;
const auth = getAuth(fbApp);
const connEl = () => document.getElementById("connStatus");

async function subirFotos(files, recorridaId){
  const urls = [];
  for(const file of files){
    const path = `recorridas/${recorridaId}/${Date.now()}_${file.name}`;
    const r = ref(storage, path);
    await uploadBytes(r, file);
    urls.push(await getDownloadURL(r));
  }
  return urls;
}

function currentOperadorNombre(){
  const u = auth.currentUser;
  return u ? (u.displayName || u.email) : "Desconocido";
}

onAuthStateChanged(auth, (user)=>{
  if(user){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainScreen").style.display = "block";
    actualizarIndicadorConexion();
    iniciarEscuchas();
  }else{
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("mainScreen").style.display = "none";
  }
});

function actualizarIndicadorConexion(){
  if(!connEl()) return;
  if(navigator.onLine){
    connEl().textContent = "🟢 " + currentOperadorNombre();
    connEl().style.color = "";
  }else{
    connEl().textContent = "🔴 Sin señal — guardando local";
    connEl().style.color = "#E4BE7A";
  }
}
window.addEventListener("online", actualizarIndicadorConexion);
window.addEventListener("offline", actualizarIndicadorConexion);

function mostrarTab(tab){
  const esLogin = tab==="login";
  document.getElementById("bloqueLogin").style.display = esLogin?"block":"none";
  document.getElementById("bloqueRegistro").style.display = esLogin?"none":"block";
  document.getElementById("tabLogin").style.background = esLogin?"var(--green)":"transparent";
  document.getElementById("tabLogin").style.color = esLogin?"var(--paper)":"var(--green)";
  document.getElementById("tabRegistro").style.background = esLogin?"transparent":"var(--green)";
  document.getElementById("tabRegistro").style.color = esLogin?"var(--green)":"var(--paper)";
  document.getElementById("loginError").textContent = "";
}
function traducirErrorAuth(codigo){
  const mapa = {
    "auth/invalid-email":"El email no es válido.", "auth/user-not-found":"No existe una cuenta con ese email.",
    "auth/wrong-password":"Contraseña incorrecta.", "auth/invalid-credential":"Email o contraseña incorrectos.",
    "auth/email-already-in-use":"Ya existe una cuenta con ese email — iniciá sesión.",
    "auth/weak-password":"La contraseña necesita al menos 6 caracteres."
  };
  return mapa[codigo] || "No se pudo completar la operación.";
}
function hacerLogin(){
  const email = document.getElementById("li_email").value.trim();
  const pass = document.getElementById("li_pass").value;
  signInWithEmailAndPassword(auth,email,pass).catch(e=>document.getElementById("loginError").textContent=traducirErrorAuth(e.code));
}
function hacerRegistro(){
  const nombre = document.getElementById("re_nombre").value.trim();
  const email = document.getElementById("re_email").value.trim();
  const pass = document.getElementById("re_pass").value;
  if(!nombre){ document.getElementById("loginError").textContent="Ingresá tu nombre."; return; }
  createUserWithEmailAndPassword(auth,email,pass)
    .then(cred=>updateProfile(cred.user,{displayName:nombre}))
    .catch(e=>document.getElementById("loginError").textContent=traducirErrorAuth(e.code));
}
function cerrarSesion(){ signOut(auth); }

/* ---------- datos compartidos en tiempo real ---------- */
let STORE = { clientes:[], potreros:[], recorridas:[], ordenes:[], campanas:[], suelos:[] };

function refrescarVistaActual(){
  const activa = document.querySelector(".tab-btn.active");
  const nombre = activa ? activa.dataset.view : "clientes";
  if(nombre==="clientes") renderClientes();
  if(nombre==="potreros") renderPotreros();
  if(nombre==="historial") renderHistorial();
  poblarFiltros();
}

function iniciarEscuchas(){
  onSnapshot(query(collection(db,"clientes"), orderBy("nombre")), snap=>{
    STORE.clientes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    refrescarVistaActual();
  }, err=>console.error("clientes:",err));

  onSnapshot(query(collection(db,"potreros"), orderBy("nombre")), snap=>{
    STORE.potreros = snap.docs.map(d=>({id:d.id, ...d.data()}));
    refrescarVistaActual();
  }, err=>console.error("potreros:",err));

  onSnapshot(query(collection(db,"recorridas"), orderBy("fecha","desc")), snap=>{
    STORE.recorridas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    refrescarVistaActual();
  }, err=>console.error("recorridas:",err));

  // Sin orderBy en el servidor: si algún documento viejo no tiene el campo
  // de fecha esperado, Firestore lo excluiría en silencio. Ordenamos acá,
  // tolerando documentos antiguos con nombres de campo distintos.
  onSnapshot(collection(db,"ordenesAplicacion"), snap=>{
    STORE.ordenes = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>{
        const fa = a.fechaRecomendada || a.fecha || "";
        const fb = b.fechaRecomendada || b.fecha || "";
        return fb.localeCompare(fa);
      });
    refrescarVistaActual();
  }, err=>console.error("ordenes:",err));

  // Campañas (siembra → cosecha) y análisis de suelo: se ordenan en el cliente.
  onSnapshot(collection(db,"campanas"), snap=>{
    STORE.campanas = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(b.fechaSiembra||"").localeCompare(a.fechaSiembra||""));
  }, err=>console.error("campanas:",err));

  onSnapshot(collection(db,"suelos"), snap=>{
    STORE.suelos = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  }, err=>console.error("suelos:",err));
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("es-UY",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function showToast(msg, ms=2200){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),ms); }
function showToastGuardado(msgOnline){
  showToast(navigator.onLine ? msgOnline : msgOnline + " (sin señal: se sincroniza solo cuando vuelva la conexión)");
}
function closeForm(){ document.getElementById("formOverlay").classList.remove("show"); }

// Escapa texto del usuario antes de meterlo en HTML (evita que comillas o
// símbolos rompan la pantalla). Se usa en todo lo nuevo.
function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtNum(n, dec=0){
  if(n===null || n===undefined || n==="" || isNaN(n)) return "—";
  return Number(n).toLocaleString("es-UY",{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
// Firestore, sin señal, no confirma una escritura hasta que vuelve la conexión
// (aunque el dato ya queda guardado en el celular). Esperamos la confirmación
// unos segundos para detectar errores reales y, si no llega, seguimos: el
// dato está en cola y se sincroniza solo.
function confirmarEscritura(promesa){
  promesa.catch(e=>console.error("Escritura:", e));
  return Promise.race([promesa, new Promise(res=>setTimeout(res, 3000))]);
}

function poblarFiltros(){
  const opciones = STORE.clientes.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join("");
  ["filtroClientePotreros","filtroClienteHist"].forEach(id=>{
    const el = document.getElementById(id);
    const prev = el.value;
    el.innerHTML = `<option value="">Todos los clientes</option>` + opciones;
    if([...el.options].some(o=>o.value===prev)) el.value = prev;
  });
  const clienteFiltro = document.getElementById("filtroClienteHist").value;
  const potrerosDeCliente = clienteFiltro ? STORE.potreros.filter(p=>p.clienteId===clienteFiltro) : STORE.potreros;
  const elP = document.getElementById("filtroPotreroHist");
  const prevP = elP.value;
  elP.innerHTML = `<option value="">Todos los potreros</option>` + potrerosDeCliente.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join("");
  if([...elP.options].some(o=>o.value===prevP)) elP.value = prevP;
}

/* ==========================================================
   NAV
   ========================================================== */
let vistaActualNombre = "clientes";
function showView(name){
  vistaActualNombre = name;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-"+name).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===name));
  if(name==="clientes") renderClientes();
  if(name==="potreros") renderPotreros();
  if(name==="historial") renderHistorial();
}
function fabAction(){

async function guardarCliente(){
  const id = document.getElementById("cl_id").value;
  const nombre = document.getElementById("cl_nombre").value.trim();
  if(!nombre){ showToast("Ingresá un nombre"); return; }
  const datos = {
    nombre, zona: document.getElementById("cl_zona").value.trim(),
    telefono: document.getElementById("cl_telefono").value.trim(),
    notas: document.getElementById("cl_notas").value.trim()
  };
  try{
    if(id){
      await updateDoc(doc(db,"clientes",id), datos);
      // Si cambió el nombre, propagarlo a los potreros y recorridas ya cargados
      const nuevosPotreros = STORE.potreros.filter(p=>p.clienteId===id);
      for(const p of nuevosPotreros){
        if(p.clienteNombre !== nombre) await updateDoc(doc(db,"potreros",p.id), { clienteNombre: nombre });
      }
      const nuevasRec = STORE.recorridas.filter(r=>r.clienteId===id);
      for(const r of nuevasRec){
        if(r.clienteNombre !== nombre) await updateDoc(doc(db,"recorridas",r.id), { clienteNombre: nombre });
      }
    }else{
      await addDoc(collection(db,"clientes"), {...datos, createdAt: serverTimestamp()});
    }
    closeForm(); showToastGuardado(id?"Cliente actualizado":"Cliente guardado");
  }catch(e){ console.error(e); showToast("No se pudo guardar"); }
}

  const d = new Date(), y = d.getFullYear();

}

async function guardarCampana(){
  const id = document.getElementById("cp_id").value;
  const potreroId = document.getElementById("cp_potreroId").value;
  const p = STORE.potreros.find(x=>x.id===potreroId);
  const cultivo = document.getElementById("cp_cultivo").value.trim();
  if(!cultivo){ showToast("Ingresá el cultivo"); return; }
  const fechaSiembra = document.getElementById("cp_fechaSiembra").value;
  const fechaCosecha = document.getElementById("cp_fechaCosecha").value;
  if(fechaSiembra && fechaCosecha && fechaCosecha < fechaSiembra){ showToast("La cosecha no puede ser anterior a la siembra"); return; }
  const numOrNull = (elId)=>{ const v=document.getElementById(elId).value; if(v==="") return null; const n=parseFloat(v); return isNaN(n)?null:n; };
  const humedad = numOrNull("cp_humedad");
  const rendimiento = numOrNull("cp_rendimiento");
  if(humedad!==null && (humedad<0 || humedad>100)){ showToast("La humedad tiene que estar entre 0 y 100"); return; }
  if(rendimiento!==null && rendimiento<0){ showToast("El rendimiento no puede ser negativo"); return; }

  const datos = {
    potreroId, zafra: document.getElementById("cp_zafra").value.trim(), cultivo,
    cultivar: document.getElementById("cp_cultivar").value.trim(),
    fechaSiembra, fechaCosecha, humedad, rendimiento,
    observaciones: document.getElementById("cp_observaciones").value.trim(),
    autor: currentOperadorNombre(), updatedAt: serverTimestamp()
  };
  const btn = document.getElementById("cp_saveBtn");
  btn.disabled = true; btn.textContent = "Guardando…";
  try{
    if(id){
      await confirmarEscritura(updateDoc(doc(db,"campanas",id), datos));
    }else{
      await confirmarEscritura(addDoc(collection(db,"campanas"), {...datos, createdAt: serverTimestamp()}));
    }
    // Si es la campaña más reciente y sigue en curso, el cultivo del potrero
    // se actualiza solo (así las próximas recorridas ya arrancan con el cultivo correcto).
    if(!fechaCosecha && p && p.cultivo !== cultivo){
      const hayMasReciente = STORE.campanas.some(x=>x.potreroId===potreroId && x.id!==id && (x.fechaSiembra||"") > (fechaSiembra||""));
      if(!hayMasReciente) await confirmarEscritura(updateDoc(doc(db,"potreros",potreroId), { cultivo }));
    }
    verPotrero(potreroId);
    showToastGuardado(id?"Campaña actualizada":"Campaña guardada");
  }catch(e){
    console.error(e);
    showToast("No se pudo guardar la campaña");
    btn.disabled = false; btn.textContent = id?"Guardar cambios":"Guardar campaña";
  }
}

function confirmarEliminarCampana(campanaId){
  const c = STORE.campanas.find(x=>x.id===campanaId);
  if(!c) return;
  const p = STORE.potreros.find(x=>x.id===c.potreroId);
  const modal = document.getElementById("formModal");
  modal.innerHTML = `

    <h1 class="page-title">¿Eliminar esta campaña?</h1>
    <p style="font-size:13.5px;">Se va a borrar la campaña de <b>${esc(c.cultivo)}</b> (zafra ${esc(c.zafra||"—")}) de ${p?esc(p.nombre):"este potrero"}. Las recorridas y órdenes de aplicación no se borran. Esta acción no se puede deshacer.</p>
    <button class="btn btn-outline" style="margin-top:16px;" onclick="abrirFormCampana('${campanaId}')">Cancelar</button>

}

async function eliminarCampana(campanaId){

/* ==========================================================
   ANÁLISIS DE SUELO (por potrero)
   ========================================================== */
function resumenValoresSuelo(s){
  const v = (x)=> x!==null && x!==undefined && x!=="";
  return [
    v(s.ph) ? ("pH " + fmtNum(s.ph,2)) : "",
    v(s.materiaOrganica) ? ("MO " + fmtNum(s.materiaOrganica,2) + "%") : "",
    v(s.fosforo) ? ("P " + fmtNum(s.fosforo,1) + " ppm") : "",
    v(s.potasio) ? ("K " + fmtNum(s.potasio,2) + " meq/100 g") : ""
  ].filter(Boolean).join(" · ");
}

function htmlSuelosDePotrero(potreroId){
  const lista = STORE.suelos.filter(s=>s.potreroId===potreroId);
  if(lista.length===0){
    return `<div class="empty" style="padding:18px 10px;"><b>Sin análisis de suelo.</b>Cargá los valores clave y adjuntá el informe del laboratorio.</div>`;
  }
  return lista.map(s=>{
    const detalle = [s.laboratorio, s.profundidad].filter(Boolean).join(" · ");
    return `<div class="card" onclick="abrirFormSuelo('${s.id}','${potreroId}')">
      <b>${fmtDate(s.fecha)}${s.archivoUrl?`<span class="pill">📎 informe</span>`:""}</b>
      <div class="sub">${esc(resumenValoresSuelo(s)) || "Sin valores cargados"}</div>
      ${detalle?`<div class="meta">${esc(detalle)}</div>`:""}
    </div>`;
  }).join("");
}

async function guardarSuelo(){
  const id = document.getElementById("su_id").value;
  const potreroId = document.getElementById("su_potreroId").value;
  const actual = id ? STORE.suelos.find(x=>x.id===id) : null;
  const fecha = document.getElementById("su_fecha").value || todayStr();
  const numOrNull = (elId)=>{ const v=document.getElementById(elId).value; if(v==="") return null; const n=parseFloat(v); return isNaN(n)?null:n; };
  const ph = numOrNull("su_ph"), materiaOrganica = numOrNull("su_mo"), fosforo = numOrNull("su_p"), potasio = numOrNull("su_k");
  if(ph!==null && (ph<0 || ph>14)){ showToast("El pH tiene que estar entre 0 y 14"); return; }
  if(materiaOrganica!==null && (materiaOrganica<0 || materiaOrganica>100)){ showToast("La materia orgánica debe estar entre 0 y 100 %"); return; }
  if([fosforo,potasio].some(x=>x!==null && x<0)){ showToast("Los valores no pueden ser negativos"); return; }
  const file = document.getElementById("su_archivo").files[0];
  if(file && file.size > 15*1024*1024){ showToast("El archivo supera los 15 MB"); return; }

  const btn = document.getElementById("su_saveBtn");
  btn.disabled = true; btn.textContent = "Guardando…";

  let archivoUrl = actual ? (actual.archivoUrl||"") : "";
  let archivoNombre = actual ? (actual.archivoNombre||"") : "";
  let aviso = "";
  if(file){
    if(!navigator.onLine){
      aviso = "Sin señal: el análisis quedó guardado sin el informe. Adjuntalo después, editándolo.";
    }else{
      try{
        const nombreSeguro = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
        const r = ref(storage, `suelos/${potreroId}/${Date.now()}_${nombreSeguro}`);
        await uploadBytes(r, file);
        archivoUrl = await getDownloadURL(r);
        archivoNombre = file.name;
      }catch(err){
        console.error("Archivo de suelo:", err);
        aviso = "El análisis se guardó, pero el informe no se pudo subir. Probá adjuntarlo de nuevo.";
      }
    }
  }

  const datos = {
    potreroId, fecha,
    laboratorio: document.getElementById("su_laboratorio").value.trim(),
    profundidad: document.getElementById("su_profundidad").value.trim(),
    ph, materiaOrganica, fosforo, potasio,
    otros: document.getElementById("su_otros").value.trim(),
    observaciones: document.getElementById("su_obs").value.trim(),
    archivoUrl, archivoNombre,
    autor: currentOperadorNombre(), updatedAt: serverTimestamp()
  };
  try{
    if(id){
      await confirmarEscritura(updateDoc(doc(db,"suelos",id), datos));
    }else{
      await confirmarEscritura(addDoc(collection(db,"suelos"), {...datos, createdAt: serverTimestamp()}));
    }
    verPotrero(potreroId);
    if(aviso) showToast(aviso, 4500); else showToastGuardado(id?"Análisis actualizado":"Análisis guardado");
  }catch(e){
    console.error(e);
    showToast("No se pudo guardar el análisis");
    btn.disabled = false; btn.textContent = id?"Guardar cambios":"Guardar análisis";
  }
}

function confirmarEliminarSuelo(sueloId){
  const s = STORE.suelos.find(x=>x.id===sueloId);
  if(!s) return;
  const p = STORE.potreros.find(x=>x.id===s.potreroId);
  const modal = document.getElementById("formModal");
  modal.innerHTML = `
    <div class="modal-handle"></div>
    <h1 class="page-title">¿Eliminar este análisis de suelo?</h1>
    <p style="font-size:13.5px;">Se va a borrar el análisis del ${fmtDate(s.fecha)} de ${p?esc(p.nombre):"este potrero"}. Esta acción no se puede deshacer.</p>
    <button class="btn btn-outline" style="margin-top:16px;" onclick="abrirFormSuelo('${sueloId}')">Cancelar</button>
    <button class="btn" style="margin-top:10px; width:100%; background:var(--bad); color:#fff;" onclick="eliminarSuelo('${sueloId}')">Sí, eliminar</button>
  `;
  document.getElementById("formOverlay").classList.add("show");
}

async function eliminarSuelo(sueloId){
  const s = STORE.suelos.find(x=>x.id===sueloId);
  try{
    await confirmarEscritura(deleteDoc(doc(db,"suelos",sueloId)));
    if(s) verPotrero(s.potreroId); else closeForm();
    showToast("Análisis eliminado");
  }catch(e){ console.error(e); showToast("No se pudo eliminar"); }
}

/* ==========================================================
   EXCEL — historial completo de un potrero
   ========================================================== */
async function descargarHistorialExcel(potreroId){
  if(!window.XLSX){ showToast("No se pudo cargar el generador de Excel — revisá tu conexión e intentá de nuevo"); return; }
  const p = STORE.potreros.find(x=>x.id===potreroId);
  if(!p) return;

  const asc = (arr, key)=>[...arr].sort((a,b)=>(a[key]||"").localeCompare(b[key]||""));
  const recs  = asc(STORE.recorridas.filter(r=>r.potreroId===potreroId), "fecha");
  const ords  = asc(STORE.ordenes.filter(o=>o.potreroId===potreroId), "fechaRecomendada");
  const camps = asc(STORE.campanas.filter(c=>c.potreroId===potreroId), "fechaSiembra");
  const sue   = asc(STORE.suelos.filter(s=>s.potreroId===potreroId), "fecha");

  // Fechas como fechas reales de Excel (número de serie + formato dd/mm/aaaa),
  // así se pueden ordenar y filtrar. Las columnas de fecha se formatean en hoja().
  const dt = (iso)=>{
    if(!iso) return "";
    const [y,m,d] = iso.split("-").map(Number);
    return (Date.UTC(y,m-1,d) - Date.UTC(1899,11,30)) / 86400000;
  };
  const n = (x)=> (x===null || x===undefined || x==="") ? "" : x;
  const hoja = (filas, anchos, { fechas=[], filtro=true, desde=1 } = {})=>{
    const ws = XLSX.utils.aoa_to_sheet(filas);
    ws["!cols"] = anchos.map(w=>({wch:w}));
    for(let r=desde; r<filas.length; r++){
      fechas.forEach(c=>{
        const cell = ws[XLSX.utils.encode_cell({r, c})];
        if(cell && typeof cell.v === "number") cell.z = "dd/mm/yyyy";
      });
    }
    if(filtro && filas.length>1) ws["!autofilter"] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:filas.length-1, c:anchos.length-1}}) };
    return ws;
  };
  const textoProductos = (o)=>(o.productos||[]).map(pr=>`${pr.orden||"-"}) ${pr.nombre} ${pr.dosis} ${pr.unidad}`).join("; ");

  // --- Resumen
  const resumen = [
    ["Historial del potrero"], [],
    ["Potrero", p.nombre], ["Cliente", p.clienteNombre], ["Campo / establecimiento", p.campo||""],
    ["Hectáreas", n(p.hectareas)], ["Cultivo actual", p.cultivo||""], ["Generado el", dt(todayStr())], [],
    ["Campañas", camps.length], ["Recorridas", recs.length], ["Órdenes de aplicación", ords.length], ["Análisis de suelo", sue.length]
  ];

  // --- Cronología (todo junto, de lo más viejo a lo más nuevo)
  const eventos = [];
  camps.forEach(c=>{
    if(c.fechaSiembra) eventos.push([c.fechaSiembra, "Siembra", `${c.cultivo||""}${c.cultivar?" – "+c.cultivar:""} (zafra ${c.zafra||"—"})`]);
    if(c.fechaCosecha) eventos.push([c.fechaCosecha, "Cosecha", `${c.cultivo||""}: ${c.rendimiento?fmtNum(c.rendimiento)+" kg/ha":"rendimiento sin cargar"}${c.humedad?", humedad "+fmtNum(c.humedad,1)+"%":""}`]);
  });
  recs.forEach(r=>eventos.push([r.fecha, "Recorrida", [r.estadoFenologico, r.recomendacion||r.problema].filter(Boolean).join(" — ")]));
  ords.forEach(o=>eventos.push([o.fechaRecomendada, "Aplicación recomendada", [textoProductos(o), o.realizada||"seguimiento sin definir"].filter(Boolean).join(" — ")]));
  sue.forEach(s=>eventos.push([s.fecha, "Análisis de suelo", resumenValoresSuelo(s)||"Sin valores cargados"]));
  eventos.sort((a,b)=>(a[0]||"").localeCompare(b[0]||""));
  const cronologia = [["Fecha","Tipo","Detalle"], ...eventos.map(e=>[dt(e[0]), e[1], e[2]])];

  // --- Campañas
  const campanas = [["Zafra","Cultivo","Cultivar","Fecha de siembra","Fecha de cosecha","Humedad del grano (%)","Rendimiento (kg/ha)","Producción estimada (t)","Observaciones"],
    ...camps.map(c=>[c.zafra||"", c.cultivo||"", c.cultivar||"", dt(c.fechaSiembra), dt(c.fechaCosecha), n(c.humedad), n(c.rendimiento),
      (c.rendimiento && p.hectareas) ? Math.round(c.rendimiento*p.hectareas/1000*10)/10 : "", c.observaciones||""])];

  // --- Recorridas
  const recorridas = [["Fecha","Estado del cultivo","Fenología","Prioridad","¿Requiere aplicación?","Problema detectado","Situación del potrero","Recomendación","Autor","Enviada al cliente","Ubicación (mapa)"],
    ...recs.map(r=>[dt(r.fecha), r.estadoCultivo||"", r.estadoFenologico||"", r.prioridad||"", r.requiereAplicacion||"", r.problema||"", r.situacionPotrero||"", r.recomendacion||"", r.autor||"",
      r.enviado ? ("Sí" + (r.enviadoFecha?" ("+fmtDate(r.enviadoFecha)+")":"")) : "No",
      r.ubicacion ? `https://www.google.com/maps?q=${r.ubicacion.lat},${r.ubicacion.lng}` : ""])];

  // --- Aplicaciones (una fila por producto, en orden de carga)
  const aplicaciones = [["Fecha recomendada","Fecha de la recorrida","Orden de carga","Producto","Dosis","Unidad","¿Se realizó?","Modificaciones","Observaciones"]];
  ords.forEach(o=>{
    const rec = STORE.recorridas.find(r=>r.id===o.recorridaId);
    const prods = (o.productos&&o.productos.length) ? o.productos : [{}];
    prods.forEach(pr=>aplicaciones.push([dt(o.fechaRecomendada), dt(rec?rec.fecha:""), n(pr.orden), pr.nombre||"", n(pr.dosis), pr.unidad||"", o.realizada||"", o.modificaciones||"", o.observaciones||""]));
  });

  // --- Suelo
  const suelo = [["Fecha de muestreo","Laboratorio","Profundidad","pH (agua)","Materia orgánica (%)","Fósforo (ppm)","Potasio (meq/100 g)","Otros valores","Observaciones","Informe adjunto (enlace)"],
    ...sue.map(s=>[dt(s.fecha), s.laboratorio||"", s.profundidad||"", n(s.ph), n(s.materiaOrganica), n(s.fosforo), n(s.potasio), s.otros||"", s.observaciones||"", s.archivoUrl||""])];

  const wb = XLSX.utils.book_new();
  const wsResumen = hoja(resumen,[26,40],{ filtro:false });
  const celdaFecha = wsResumen[XLSX.utils.encode_cell({r:7, c:1})];   // "Generado el"
  if(celdaFecha && typeof celdaFecha.v === "number") celdaFecha.z = "dd/mm/yyyy";
  XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");
  XLSX.utils.book_append_sheet(wb, hoja(cronologia,[12,24,90],{ fechas:[0] }), "Cronología");
  XLSX.utils.book_append_sheet(wb, hoja(campanas,[10,14,22,16,16,14,14,14,40],{ fechas:[3,4] }), "Campañas");
  XLSX.utils.book_append_sheet(wb, hoja(recorridas,[12,14,22,11,14,40,40,50,18,18,40],{ fechas:[0] }), "Recorridas");
  XLSX.utils.book_append_sheet(wb, hoja(aplicaciones,[16,16,10,28,10,8,22,36,36],{ fechas:[0,1] }), "Aplicaciones");
  XLSX.utils.book_append_sheet(wb, hoja(suelo,[14,18,14,10,12,12,14,30,36,40],{ fechas:[0] }), "Suelo");

  const base = ("Historial_" + (p.clienteNombre||"") + "_" + p.nombre + "_" + todayStr())
    .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9_\-]/g,"_");
  const archivo = base + ".xlsx";
  const bytes = XLSX.write(wb, { bookType:"xlsx", type:"array" });
  const mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  const blob = new Blob([bytes], { type: mime });

  // En el celular se abre la hoja de "Compartir" (guardar en Archivos, WhatsApp, mail…).
  // En la computadora se descarga directo.
  const esCelular = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  try{
    const file = new File([blob], archivo, { type: mime });
    if(esCelular && navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: archivo });
      return;
    }
  }catch(e){
    if(e && e.name==="AbortError") return;   // el usuario cerró la hoja de compartir
    console.error("Compartir Excel:", e);
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = archivo;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
  showToast("Excel descargado");
}

/* ==========================================================
   DICTADO POR VOZ (Web Speech API — nativo del navegador)
   ========================================================== */
let recognizer = null;
let campoDictando = null;

function toggleDictado(textareaId, btnId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast("Este navegador no soporta dictado por voz"); return; }

  const btn = document.getElementById(btnId);

  // Si ya está grabando (en cualquier campo), tocar de nuevo lo detiene.
  if(recognizer && campoDictando){
    recognizer.stop();
    return;
  }

  recognizer = new SR();
  recognizer.lang = "es-UY";
  recognizer.continuous = true;
  recognizer.interimResults = false;
  campoDictando = textareaId;

  btn.textContent = "🔴 Escuchando… (tocá para detener)";
  btn.classList.add("btn-dictando");

  recognizer.onresult = (e)=>{
    const ta = document.getElementById(textareaId);
    if(!ta) return;
    let textoNuevo = "";
    for(let i=e.resultIndex; i<e.results.length; i++){
      if(e.results[i].isFinal) textoNuevo += e.results[i][0].transcript + " ";
    }
    if(textoNuevo.trim()){
      ta.value = (ta.value ? ta.value.trim()+" " : "") + textoNuevo.trim();
    }
  };
  recognizer.onerror = (e)=>{
    console.error("Dictado:", e.error);
    if(e.error === "not-allowed"){
      showToast("Necesitás dar permiso de micrófono para dictar");
    }else if(e.error !== "no-speech" && e.error !== "aborted"){
      showToast("El dictado se cortó — probá de nuevo");
    }
  };
  recognizer.onend = ()=>{
    const b = document.getElementById(btnId);
    if(b){ b.textContent = "🎤 Dictar por voz"; b.classList.remove("btn-dictando"); }
    recognizer = null;
    campoDictando = null;
  };
  recognizer.start();
}

function obtenerUbicacion(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => { console.error("Geolocalización:", err); resolve(null); },
      { enableHighAccuracy:true, timeout:8000, maximumAge:60000 }
    );
  });
}

function validarCantidadFotos(cantidadExistentes){
  const fileInput = document.getElementById("rc_fotos");
  const hint = document.getElementById("rc_fotosHint");
  const disponibles = Math.max(0, 4 - cantidadExistentes);
  if(fileInput.files.length > disponibles){
    showToast(`Máximo 4 fotos por recorrida. Ya tenés ${cantidadExistentes} guardada(s), así que podés agregar hasta ${disponibles} más. Volvé a elegir.`);
    fileInput.value = "";
  }else if(hint){
    hint.textContent = fileInput.files.length
      ? `Seleccionaste ${fileInput.files.length} foto(s) para agregar.`
      : (cantidadExistentes?`Ya hay ${cantidadExistentes} foto(s) guardada(s). Podés agregar hasta ${disponibles} más.`:"Podés seleccionar hasta 4 fotos juntas desde la galería.");
  }
}

async function guardarRecorrida(){
  const id = document.getElementById("rc_id").value;
  const btn = document.getElementById("rc_saveBtn");
  const datos = {
    potreroId: document.getElementById("rc_potreroId").value,
    fecha: document.getElementById("rc_fecha").value || todayStr(),
    estadoCultivo: document.getElementById("rc_estadoCultivo").value.trim(),
    prioridad: document.getElementById("rc_prioridad").value,
    estadoFenologico: document.getElementById("rc_estadoFenologico").value.trim(),
    requiereAplicacion: document.getElementById("rc_requiereAplicacion").value,
    problema: document.getElementById("rc_problema").value.trim(),
    situacionPotrero: document.getElementById("rc_situacion").value.trim(),
    recomendacion: document.getElementById("rc_recomendacion").value.trim(),
    autor: currentOperadorNombre(),
    updatedAt: serverTimestamp()
  };
  const p = STORE.potreros.find(x=>x.id===datos.potreroId);
  if(p){ datos.potreroNombre = p.nombre; datos.clienteId = p.clienteId; datos.clienteNombre = p.clienteNombre; datos.campo = p.campo||""; datos.cultivo = p.cultivo||""; }

  const fileInput = document.getElementById("rc_fotos");
  const files = fileInput.files;
  const fotosExistentesActuales = id ? ((STORE.recorridas.find(r=>r.id===id)||{}).fotos||[]) : [];
  if(files && (fotosExistentesActuales.length + files.length) > 4){
    showToast(`Máximo 4 fotos por recorrida. Ya tenés ${fotosExistentesActuales.length} guardada(s); elegí como máximo ${Math.max(0,4-fotosExistentesActuales.length)} más.`);
    return;
  }
  btn.textContent = "Guardando…";

  try{
    let docId = id;
    if(id){
      await updateDoc(doc(db,"recorridas",id), datos);
    }else{
      // Geolocalización: se toma una sola vez, al crear la recorrida —
      // no se pisa después si se edita más tarde desde otro lugar.
      const ubicacion = await obtenerUbicacion();
      const nuevo = await addDoc(collection(db,"recorridas"), {...datos, ubicacion, fotos:[], enviado:false, ordenAplicacionId:null, createdAt: serverTimestamp()});
      docId = nuevo.id;
    }
    let fotosOk = true;
    if(files && files.length>0){
      try{
        const urls = await subirFotos(files, docId);
        const existentes = id ? ((STORE.recorridas.find(r=>r.id===id)||{}).fotos||[]) : [];
        await updateDoc(doc(db,"recorridas",docId), { fotos: [...existentes, ...urls] });
      }catch(fotoErr){
        console.error("Fotos:", fotoErr);
        fotosOk = false;
      }
    }
    closeForm();
    if(fotosOk){
      showToastGuardado(id?"Recorrida actualizada":"Recorrida guardada");
    }else{
      showToast("Recorrida guardada, pero las fotos no se pudieron subir sin señal — volvé a intentarlo cuando tengas conexión, editando esta misma recorrida.");
    }
  }catch(e){
    console.error(e);
    showToast("No se pudo guardar (revisá fotos/conexión)");
    btn.textContent = id?"Guardar cambios":"Guardar recorrida";
  }
}

async function descargarPDF(tipo, id){
  const el = document.querySelector("#formModal .informe");
  if(!el){ showToast("No se encontró el contenido para exportar"); return; }
  let nombreBase = "Documento";
  if(tipo==="recorrida"){
    const r = STORE.recorridas.find(x=>x.id===id);
    if(r) nombreBase = "Recorrida_"+r.clienteNombre+"_"+r.fecha;
  }else if(tipo==="orden"){
    const o = STORE.ordenes.find(x=>x.id===id);
    if(o) nombreBase = "OrdenAplicacion_"+o.clienteNombre+"_"+o.fechaRecomendada;
  }
  const archivo = nombreBase.replace(/[^a-zA-Z0-9_\-]/g,"_") + ".pdf";
  if(!window.html2pdf){ showToast("No se pudo cargar el generador de PDF — revisá tu conexión e intentá de nuevo"); return; }

  // Abrimos la pestaña YA, en el mismo click del usuario (Safari bloquea
  // las pestañas que se abren después de una espera/async). La vamos a
  // llenar con el PDF apenas esté listo.
  const ventana = window.open("", "_blank");
  if(ventana){ ventana.document.write("Generando PDF…"); }
  showToast("Generando PDF…");

  try{
    const blob = await window.html2pdf().set({
      margin: 10,
      filename: archivo,
      image: { type: "jpeg", quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
    }).from(el).outputPdf("blob");

    const url = URL.createObjectURL(blob);
    if(ventana){
      ventana.location.href = url;
    }else{
      // Si el navegador igual bloqueó la pestaña, probamos la descarga directa.
      const a = document.createElement("a");
      a.href = url; a.download = archivo;
      document.body.appendChild(a); a.click(); a.remove();
    }
    showToast("PDF listo");
  }catch(e){
    console.error(e);
    if(ventana) ventana.close();
    showToast("No se pudo generar el PDF: " + (e && e.message ? e.message : "error desconocido"));
  }
}

async function guardarOrden(){
  const id = document.getElementById("or_id").value;
  const recorridaId = document.getElementById("or_recorridaId").value;
  const rec = STORE.recorridas.find(r=>r.id===recorridaId);
  const p = STORE.potreros.find(x=>x.id===rec.potreroId);

  const productos = [];
  document.querySelectorAll("#productosOrdenWrap .prod-row-orden").forEach(row=>{
    const idx = row.dataset.idx;
    const ordenNum = parseInt(document.getElementById("po_orden_"+idx).value)||0;
    const nombre = document.getElementById("po_nombre_"+idx).value.trim();
    const dosis = parseFloat(document.getElementById("po_dosis_"+idx).value)||0;
    const unidad = document.getElementById("po_unidad_"+idx).value;
    if(nombre) productos.push({orden:ordenNum, nombre, dosis, unidad});
  });
  if(productos.length===0){ showToast("Cargá al menos un producto"); return; }
  productos.sort((a,b)=>a.orden-b.orden);

  const datos = {
    recorridaId, potreroId: rec.potreroId, potreroNombre: p.nombre,
    clienteId: p.clienteId, clienteNombre: p.clienteNombre, campo: p.campo||"",

    productos, observaciones: document.getElementById("or_observaciones").value.trim(),
    autor: currentOperadorNombre(), updatedAt: serverTimestamp()
  };

  try{
    if(id){
      await updateDoc(doc(db,"ordenesAplicacion",id), datos);
      closeForm(); showToastGuardado("Orden actualizada");
    }else{
      const nuevo = await addDoc(collection(db,"ordenesAplicacion"), {...datos, enviado:false, realizada:"", modificaciones:"", createdAt: serverTimestamp()});
      await updateDoc(doc(db,"recorridas",recorridaId), { ordenAplicacionId: nuevo.id });
      closeForm(); showToastGuardado("Orden de aplicación creada");
    }
  }catch(e){ console.error(e); showToast("No se pudo guardar"); }
}

    <textarea id="oa_modificaciones" placeholder="Detallá qué se cambió respecto a la recomendación">${o.modificaciones||""}</textarea>
    <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="guardarSeguimientoOrden('${ordenId}')">Guardar seguimiento</button>

    <div style="margin-top:14px;">
      ${o.enviado
        ? `<div class="hint" style="color:var(--sage); font-weight:700; font-size:12.5px;">✔ Enviada al cliente el ${fmtDate(o.enviadoFecha)}</div>`
        : `<button class="btn btn-outline btn-block" onclick="marcarEnviado('ordenesAplicacion','${ordenId}')">✔ Marcar orden como enviada al cliente</button>`}
    </div>
  `;
  document.getElementById("formOverlay").classList.add("show");
}

function guardarSeguimientoOrden(ordenId){
  const realizada = document.getElementById("oa_realizada").value;
  const modificaciones = document.getElementById("oa_modificaciones").value.trim();
  updateDoc(doc(db,"ordenesAplicacion",ordenId), { realizada, modificaciones })
    .then(()=>showToast("Seguimiento guardado"))
    .catch(e=>{ console.error(e); showToast("No se pudo guardar"); });
}

/* ==========================================================
   HISTORIAL GLOBAL (buscador / filtro)
   ========================================================== */
let histTab = "recorridas";
function cambiarTabHistorial(tab){
  histTab = tab;
  const esRec = tab==="recorridas";
  document.getElementById("tabHistRecorridas").style.background = esRec?"var(--green)":"transparent";
  document.getElementById("tabHistRecorridas").style.color = esRec?"var(--paper)":"var(--green)";
  document.getElementById("tabHistOrdenes").style.background = esRec?"transparent":"var(--green)";
  document.getElementById("tabHistOrdenes").style.color = esRec?"var(--green)":"var(--paper)";
  renderHistorial();
}

function renderHistorial(){
  if(histTab==="ordenes"){ renderHistorialOrdenes(); return; }
  const clienteId = document.getElementById("filtroClienteHist").value;
  const potreroId = document.getElementById("filtroPotreroHist").value;
  let lista = STORE.recorridas;
  if(clienteId) lista = lista.filter(r=>r.clienteId===clienteId);
  if(potreroId) lista = lista.filter(r=>r.potreroId===potreroId);

  const el = document.getElementById("historialList");
  if(lista.length===0){
    el.innerHTML = `<div class="empty"><b>No hay recorridas para este filtro.</b></div>`;
    return;
  }
  el.innerHTML = lista.map(r=>`
    <div class="card" onclick="verInforme('${r.id}')">
      <b>${r.clienteNombre} — ${r.potreroNombre} ${r.enviado?"✔":""}</b>
      <div class="sub">${fmtDate(r.fecha)}${r.estadoFenologico?(" · "+r.estadoFenologico):""}</div>
      <div class="meta">${(r.recomendacion||"").slice(0,80)}${(r.recomendacion||"").length>80?"…":""}</div>
    </div>
  `).join("");
}

function renderHistorialOrdenes(){
  const clienteId = document.getElementById("filtroClienteHist").value;
  const potreroId = document.getElementById("filtroPotreroHist").value;
  let lista = STORE.ordenes;
  if(clienteId) lista = lista.filter(o=>o.clienteId===clienteId);
  if(potreroId) lista = lista.filter(o=>o.potreroId===potreroId);

  const el = document.getElementById("historialList");
  if(lista.length===0){
    el.innerHTML = `<div class="empty"><b>No hay órdenes de aplicación para este filtro.</b></div>`;
    return;
  }
  el.innerHTML = lista.map(o=>{
    const nProd = (o.productos||[]).length;
    return `
    <div class="card" onclick="verOrdenAplicacion('${o.id}')" style="position:relative;">
      <b>${o.clienteNombre} — ${o.potreroNombre} ${o.enviado?"✔":""}</b>
      <div class="sub">Aplicación recomendada: ${fmtDate(o.fechaRecomendada)} · ${nProd} producto${nProd===1?"":"s"}</div>
      <div class="meta">${o.realizada?("Estado: "+o.realizada):"Seguimiento sin definir"}</div>
      <button onclick="event.stopPropagation(); confirmarEliminarOrden('${o.id}')" style="position:absolute; top:12px; right:12px; background:none; border:none; font-size:16px; cursor:pointer; color:var(--bad);">🗑</button>
    </div>`;
  }).join("");
}

function confirmarEliminarOrden(ordenId){
  const o = STORE.ordenes.find(x=>x.id===ordenId);
  if(!o) return;
  const modal = document.getElementById("formModal");
  modal.innerHTML = `
    <div class="modal-handle"></div>
    <h1 class="page-title">¿Eliminar esta orden de aplicación?</h1>
    <p style="font-size:13.5px;">Se va a borrar la orden de aplicación de <b>${o.potreroNombre}</b> (${o.clienteNombre}) recomendada para el ${fmtDate(o.fechaRecomendada)}. La recorrida que la originó no se borra. Esta acción no se puede deshacer.</p>
    <button class="btn btn-outline btn-block" style="margin-top:16px;" onclick="closeForm()">Cancelar</button>
    <button class="btn btn-block" style="margin-top:10px; background:var(--bad); color:#fff;" onclick="eliminarOrden('${ordenId}')">Sí, eliminar</button>
  `;
  document.getElementById("formOverlay").classList.add("show");
}

async function eliminarOrden(ordenId){
  const o = STORE.ordenes.find(x=>x.id===ordenId);
  try{
    if(o && o.recorridaId){
      try{
        await updateDoc(doc(db,"recorridas",o.recorridaId), { ordenAplicacionId: null });
      }catch(linkErr){
        console.error("No se pudo desvincular la recorrida (puede que ya no exista):", linkErr);
      }
    }
    await deleteDoc(doc(db,"ordenesAplicacion",ordenId));
    closeForm();
    showToast("Orden de aplicación eliminada");
  }catch(e){ console.error(e); showToast("No se pudo eliminar"); }
}

/* cerrar modal tocando el fondo */
document.getElementById("formOverlay").addEventListener("click", e=>{ if(e.target.id==="formOverlay") closeForm(); });

renderClientes();

Object.assign(window, {
  mostrarTab, hacerLogin, hacerRegistro, cerrarSesion, showView, fabAction,
  verPotrerosDeCliente, abrirFormCliente, guardarCliente,
  abrirFormPotrero, guardarPotrero, verPotrero,
  abrirFormRecorrida, guardarRecorrida, verInforme, closeForm, renderPotreros, renderHistorial,
  marcarEnviado, abrirFormOrden, guardarOrden, verOrdenAplicacion, agregarFilaProductoOrden, guardarSeguimientoOrden,
  confirmarEliminarRecorrida, eliminarRecorrida, descargarPDF,
  cambiarTabHistorial, confirmarEliminarOrden, eliminarOrden, toggleDictado,
  validarCantidadFotos,
  abrirFormCampana, guardarCampana, confirmarEliminarCampana, eliminarCampana,
  abrirFormSuelo, guardarSuelo, confirmarEliminarSuelo, eliminarSuelo,
  descargarHistorialExcel
});

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(e=>console.error("Service worker:", e));
  });
}
</script>
