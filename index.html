<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4A34">
<title>Asesoramiento Agronómico</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#1F2A22; --green:#2F4A34; --sage:#6B8F6E; --amber:#E4BE7A;
    --paper:#F2F0E4; --bg:#FBFAF6; --bad:#B4442E; --line:#E3E0D3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Poppins','Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:78px;}

  header{position:sticky; top:0; z-index:20; background:var(--green); color:var(--paper); padding:14px 18px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 10px rgba(0,0,0,.12);}
  header b{font-weight:800; font-size:17px;}
  header .sub{font-size:11px; color:var(--amber);}
  header .today{margin-left:auto; text-align:right; font-size:10px; color:var(--paper); opacity:.9;}

  main{padding:16px 16px 8px;}
  .view{display:none;} .view.active{display:block;}
  h1.page-title{font-size:15px; font-weight:700; margin:4px 0 14px; color:var(--green);}

  .card{background:var(--paper); border-radius:16px; padding:15px; margin-bottom:11px; border:1px solid var(--line); cursor:pointer;}
  .card b{font-size:14.5px; color:var(--ink); display:block;}
  .card .sub{font-size:12px; color:#6B8F6E; margin-top:2px;}
  .card .meta{font-size:11.5px; color:#8A8672; margin-top:5px;}

  .btn{appearance:none; border:none; cursor:pointer; border-radius:12px; font-family:inherit; font-weight:600; font-size:13.5px; padding:11px 16px;}
  .btn-primary{background:var(--green); color:var(--paper); width:100%;}
  .btn-outline{background:transparent; color:var(--green); border:1.5px solid var(--green); width:100%;}
  .btn-small{padding:7px 12px; font-size:12px; border-radius:9px; width:auto;}
  .fab{position:fixed; bottom:92px; left:50%; transform:translateX(206px); width:52px; height:52px; border-radius:50%; background:var(--amber); color:var(--ink); font-size:26px; border:none; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; z-index:25;}

  label.field-label{display:block; font-size:12px; font-weight:600; color:var(--green); margin:14px 0 5px;}
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%; font-family:inherit; font-size:14px; color:var(--ink); background:#fff;
    border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  textarea{min-height:80px; resize:vertical;}
  .hint{font-size:11px; color:#8A8672; margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .empty{text-align:center; padding:36px 20px; color:#8A8672; font-size:13px;}
  .empty b{display:block; color:var(--ink); font-size:14px; margin-bottom:4px;}

  nav.tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line); display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom);}
  nav.tabbar button{flex:1; background:none; border:none; font-family:inherit; cursor:pointer; padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:#B9B6A8; font-size:10.5px; font-weight:600;}
  nav.tabbar button .ic{font-size:19px; line-height:1;}
  nav.tabbar button.active{color:var(--green);}

  .modal-overlay{position:fixed; inset:0; background:rgba(31,42,34,.45); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--bg); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px 18px 26px; max-height:90vh; overflow-y:auto;}
  .modal-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--green); background:none; border:none; cursor:pointer; padding:0 0 12px; font-family:inherit;}

  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:30px; font-size:12.5px; font-weight:600; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s;}
  .toast.show{opacity:1;}

  .filter-row{display:flex; gap:8px; margin-bottom:12px;}
  .filter-row select{font-size:12.5px; padding:9px 8px;}

  /* Informe imprimible */
  .informe{background:#fff; border-radius:14px; padding:20px; border:1px solid var(--line);}
  .informe h2{font-size:17px; color:var(--green); margin:0 0 2px;}
  .informe .meta{font-size:12px; color:#6B8F6E; margin-bottom:14px;}
  .informe .bloque{margin-bottom:14px;}
  .informe .bloque h3{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--sage); margin:0 0 4px;}
  .informe .bloque p{font-size:13.5px; line-height:1.5; margin:0; white-space:pre-wrap;}

  @media print{
    header, nav.tabbar, .fab, .btn, .back-link, .modal-handle{display:none !important;}
    .modal-overlay{position:static !important; background:none !important; display:block !important;}
    .modal{max-height:none !important; overflow:visible !important; box-shadow:none !important; border-radius:0 !important; padding:0 !important;}
    body{background:#fff;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="loginScreen" style="position:fixed; inset:0; z-index:100; background:var(--green); display:flex; align-items:center; justify-content:center; padding:24px;">
    <div style="max-width:340px; width:100%;">
      <div style="text-align:center; color:var(--paper); font-weight:800; font-size:19px; margin-bottom:2px;">Asesoramiento Agronómico</div>
      <div style="text-align:center; color:var(--amber); font-size:12px; margin-bottom:22px;">Recorridas, potreros y recomendaciones</div>
      <div style="background:var(--paper); border-radius:16px; padding:18px;">
        <div style="display:flex; gap:6px; margin-bottom:14px;">
          <button type="button" id="tabLogin" class="btn btn-small" style="flex:1; background:var(--green); color:var(--paper);" onclick="mostrarTab('login')">Iniciar sesión</button>
          <button type="button" id="tabRegistro" class="btn btn-small" style="flex:1; background:transparent; color:var(--green); border:1.5px solid var(--green);" onclick="mostrarTab('registro')">Crear cuenta</button>
        </div>
        <div id="bloqueLogin">
          <label class="field-label" style="margin-top:0;">Email</label>
          <input type="text" id="li_email" placeholder="tu@email.com">
          <label class="field-label">Contraseña</label>
          <input type="password" id="li_pass" placeholder="••••••••">
          <button class="btn btn-primary" style="margin-top:14px;" onclick="hacerLogin()">Entrar</button>
        </div>
        <div id="bloqueRegistro" style="display:none;">
          <label class="field-label" style="margin-top:0;">Nombre y apellido</label>
          <input type="text" id="re_nombre" placeholder="Como te van a ver en la app">
          <label class="field-label">Email</label>
          <input type="text" id="re_email" placeholder="tu@email.com">
          <label class="field-label">Contraseña</label>
          <input type="password" id="re_pass" placeholder="Mínimo 6 caracteres">
          <button class="btn btn-primary" style="margin-top:14px;" onclick="hacerRegistro()">Crear cuenta y entrar</button>
        </div>
        <div id="loginError" class="hint" style="color:#B4442E; margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <div id="mainScreen" style="display:none;">

    <header>
      <div>
        <b>Asesoramiento</b>
        <div class="sub">Agronómico</div>
      </div>
      <div class="today" id="connStatus">🟡 Conectando…</div>
    </header>

    <main>
      <!-- ===================== CLIENTES ===================== -->
      <section class="view active" id="view-clientes">
        <h1 class="page-title">Clientes</h1>
        <div id="clientesList"></div>
      </section>

      <!-- ===================== POTREROS ===================== -->
      <section class="view" id="view-potreros">
        <h1 class="page-title">Potreros</h1>
        <div class="filter-row">
          <select id="filtroClientePotreros" onchange="renderPotreros()" style="flex:1;"><option value="">Todos los clientes</option></select>
        </div>
        <div id="potrerosList"></div>
      </section>

      <!-- ===================== HISTORIAL ===================== -->
      <section class="view" id="view-historial">
        <h1 class="page-title">Historial de recorridas</h1>
        <div class="filter-row">
          <select id="filtroClienteHist" onchange="renderHistorial()"><option value="">Todos los clientes</option></select>
          <select id="filtroPotreroHist" onchange="renderHistorial()"><option value="">Todos los potreros</option></select>
        </div>
        <div id="historialList"></div>
      </section>
    </main>

    <button class="fab" id="fabBtn" onclick="fabAction()">+</button>

    <nav class="tabbar">
      <button class="tab-btn active" data-view="clientes" onclick="showView('clientes')"><span class="ic">👤</span>CLIENTES</button>
      <button class="tab-btn" data-view="potreros" onclick="showView('potreros')"><span class="ic">🌾</span>POTREROS</button>
      <button class="tab-btn" data-view="historial" onclick="showView('historial')"><span class="ic">🕘</span>HISTORIAL</button>
    </nav>

    <div class="modal-overlay" id="formOverlay"><div class="modal" id="formModal"></div></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script type="module">
/* =========================================================
   CONFIGURACIÓN DE FIREBASE
   =========================================================
   Podés reutilizar el MISMO proyecto de Firebase que ya
   configuraste para la app de Chequeos de PGAgro (pegá el
   mismo objeto firebaseConfig acá abajo) — esta app usa
   colecciones distintas ("clientes", "potreros", "recorridas"),
   así que no pisa nada de la otra app aunque compartan proyecto.
   Si preferís mantenerlas separadas, creá un proyecto nuevo
   siguiendo los mismos pasos que ya hicimos antes.
   Además de Firestore, esta versión usa Firebase Storage para
   guardar las fotos. Un paso extra en la configuración:
   7. En el menú izquierdo: Compilación → Storage → "Comenzar" →
      aceptá el modo producción → misma región que elegiste antes.
   8. Pestaña "Rules" de Storage → pegá esto → Publicar:
      rules_version = '2';
      service firebase.storage {
        match /b/{bucket}/o {
          match /{allPaths=**} {
            allow read, write: if request.auth != null;
          }
        }
      }
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCtENFVRpESM_3CByQtf0xSmWDPOiVF8x8",
  authDomain: "pgagro--asesoramientos.firebaseapp.com",
  projectId: "pgagro--asesoramientos",
  storageBucket: "pgagro--asesoramientos.firebasestorage.app",
  messagingSenderId: "774716962844",
  appId: "1:774716962844:web:32afe90165218896ff07d9"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  updateProfile, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);
const auth = getAuth(fbApp);
const connEl = () => document.getElementById("connStatus");

async function subirFotos(files, recorridaId){
  const urls = [];
  for(const file of files){
    const path = `recorridas/${recorridaId}/${Date.now()}_${file.name}`;
    const r = ref(storage, path);
    await uploadBytes(r, file);
    urls.push(await getDownloadURL(r));
  }
  return urls;
}

function currentOperadorNombre(){
  const u = auth.currentUser;
  return u ? (u.displayName || u.email) : "Desconocido";
}

onAuthStateChanged(auth, (user)=>{
  if(user){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainScreen").style.display = "block";
    if(connEl()) connEl().textContent = "🟢 " + currentOperadorNombre();
    iniciarEscuchas();
  }else{
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("mainScreen").style.display = "none";
  }
});

function mostrarTab(tab){
  const esLogin = tab==="login";
  document.getElementById("bloqueLogin").style.display = esLogin?"block":"none";
  document.getElementById("bloqueRegistro").style.display = esLogin?"none":"block";
  document.getElementById("tabLogin").style.background = esLogin?"var(--green)":"transparent";
  document.getElementById("tabLogin").style.color = esLogin?"var(--paper)":"var(--green)";
  document.getElementById("tabRegistro").style.background = esLogin?"transparent":"var(--green)";
  document.getElementById("tabRegistro").style.color = esLogin?"var(--green)":"var(--paper)";
  document.getElementById("loginError").textContent = "";
}
function traducirErrorAuth(codigo){
  const mapa = {
    "auth/invalid-email":"El email no es válido.", "auth/user-not-found":"No existe una cuenta con ese email.",
    "auth/wrong-password":"Contraseña incorrecta.", "auth/invalid-credential":"Email o contraseña incorrectos.",
    "auth/email-already-in-use":"Ya existe una cuenta con ese email — iniciá sesión.",
    "auth/weak-password":"La contraseña necesita al menos 6 caracteres."
  };
  return mapa[codigo] || "No se pudo completar la operación.";
}
function hacerLogin(){
  const email = document.getElementById("li_email").value.trim();
  const pass = document.getElementById("li_pass").value;
  signInWithEmailAndPassword(auth,email,pass).catch(e=>document.getElementById("loginError").textContent=traducirErrorAuth(e.code));
}
function hacerRegistro(){
  const nombre = document.getElementById("re_nombre").value.trim();
  const email = document.getElementById("re_email").value.trim();
  const pass = document.getElementById("re_pass").value;
  if(!nombre){ document.getElementById("loginError").textContent="Ingresá tu nombre."; return; }
  createUserWithEmailAndPassword(auth,email,pass)
    .then(cred=>updateProfile(cred.user,{displayName:nombre}))
    .catch(e=>document.getElementById("loginError").textContent=traducirErrorAuth(e.code));
}
function cerrarSesion(){ signOut(auth); }

/* ---------- datos compartidos en tiempo real ---------- */
let STORE = { clientes:[], potreros:[], recorridas:[], ordenes:[] };

function refrescarVistaActual(){
  const activa = document.querySelector(".tab-btn.active");
  const nombre = activa ? activa.dataset.view : "clientes";
  if(nombre==="clientes") renderClientes();
  if(nombre==="potreros") renderPotreros();
  if(nombre==="historial") renderHistorial();
  poblarFiltros();
}

function iniciarEscuchas(){
  onSnapshot(query(collection(db,"clientes"), orderBy("nombre")), snap=>{
    STORE.clientes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    refrescarVistaActual();
  }, err=>console.error("clientes:",err));

  onSnapshot(query(collection(db,"potreros"), orderBy("nombre")), snap=>{
    STORE.potreros = snap.docs.map(d=>({id:d.id, ...d.data()}));
    refrescarVistaActual();
  }, err=>console.error("potreros:",err));

  onSnapshot(query(collection(db,"recorridas"), orderBy("fecha","desc")), snap=>{
    STORE.recorridas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    refrescarVistaActual();
  }, err=>console.error("recorridas:",err));

  onSnapshot(query(collection(db,"ordenesAplicacion"), orderBy("fecha","desc")), snap=>{
    STORE.ordenes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    refrescarVistaActual();
  }, err=>console.error("ordenes:",err));
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("es-UY",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function closeForm(){ document.getElementById("formOverlay").classList.remove("show"); }

function poblarFiltros(){
  const opciones = STORE.clientes.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join("");
  ["filtroClientePotreros","filtroClienteHist"].forEach(id=>{
    const el = document.getElementById(id);
    const prev = el.value;
    el.innerHTML = `<option value="">Todos los clientes</option>` + opciones;
    if([...el.options].some(o=>o.value===prev)) el.value = prev;
  });
  const clienteFiltro = document.getElementById("filtroClienteHist").value;
  const potrerosDeCliente = clienteFiltro ? STORE.potreros.filter(p=>p.clienteId===clienteFiltro) : STORE.potreros;
  const elP = document.getElementById("filtroPotreroHist");
  const prevP = elP.value;
  elP.innerHTML = `<option value="">Todos los potreros</option>` + potrerosDeCliente.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join("");
  if([...elP.options].some(o=>o.value===prevP)) elP.value = prevP;
}

/* ==========================================================
   NAV
   ========================================================== */
let vistaActualNombre = "clientes";
function showView(name){
  vistaActualNombre = name;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-"+name).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===name));
  if(name==="clientes") renderClientes();
  if(name==="potreros") renderPotreros();
  if(name==="historial") renderHistorial();
}
function fabAction(){
  if(vistaActualNombre==="clientes") abrirFormCliente();
  else if(vistaActualNombre==="potreros") abrirFormPotrero();
  else showToast("Para cargar una recorrida, entrá al potrero desde la pestaña Potreros");
}

/* ==========================================================
   CLIENTES
   ========================================================== */
function renderClientes(){
  const el = document.getElementById("clientesList");
  if(STORE.clientes.length===0){
    el.innerHTML = `<div class="empty"><b>Todavía no cargaste clientes.</b>Tocá el botón + para agregar el primero.</div>`;
    return;
  }
  el.innerHTML = STORE.clientes.map(c=>{
    const nPotreros = STORE.potreros.filter(p=>p.clienteId===c.id).length;
    return `<div class="card" style="position:relative;">
      <div onclick="verPotrerosDeCliente('${c.id}')">
        <b>${c.nombre}</b>
        <div class="sub">${c.zona||"Sin zona"}</div>
        <div class="meta">${nPotreros} potrero${nPotreros===1?"":"s"}</div>
      </div>
      <button onclick="event.stopPropagation(); abrirFormCliente('${c.id}')" style="position:absolute; top:12px; right:12px; background:none; border:none; font-size:16px; cursor:pointer; color:var(--sage);">✎</button>
    </div>`;
  }).join("");
}
function verPotrerosDeCliente(clienteId){
  showView("potreros");
  document.getElementById("filtroClientePotreros").value = clienteId;
  renderPotreros();
}
function abrirFormCliente(clienteId){
  const editando = !!clienteId;
  const c = editando ? STORE.clientes.find(x=>x.id===clienteId) : null;
  const modal = document.getElementById("formModal");
  modal.innerHTML = `
    <div class="modal-handle"></div>
    <button class="back-link" onclick="closeForm()">‹ Volver</button>
    <h1 class="page-title">${editando?"Editar":"Nuevo"} cliente</h1>
    <input type="hidden" id="cl_id" value="${editando?clienteId:""}">
    <label class="field-label" style="margin-top:0;">Nombre del cliente</label>
    <input type="text" id="cl_nombre" placeholder="Nombre y apellido / razón social" value="${editando?(c.nombre||""):""}">
    <label class="field-label">Zona</label>
    <input type="text" id="cl_zona" placeholder="Ej: Salto, zona Termas" value="${editando?(c.zona||""):""}">
    <label class="field-label">Teléfono</label>
    <input type="text" id="cl_telefono" placeholder="09X XXX XXX" value="${editando?(c.telefono||""):""}">
    <label class="field-label">Notas</label>
    <textarea id="cl_notas" placeholder="Opcional">${editando?(c.notas||""):""}</textarea>
    <button class="btn btn-primary" style="margin-top:16px;" onclick="guardarCliente()">${editando?"Guardar cambios":"Guardar cliente"}</button>
  `;
  document.getElementById("formOverlay").classList.add("show");
}
async function guardarCliente(){
  const id = document.getElementById("cl_id").value;
  const nombre = document.getElementById("cl_nombre").value.trim();
  if(!nombre){ showToast("Ingresá un nombre"); return; }
  const datos = {
    nombre, zona: document.getElementById("cl_zona").value.trim(),
    telefono: document.getElementById("cl_telefono").value.trim(),
    notas: document.getElementById("cl_notas").value.trim()
  };
  try{
    if(id){
      await updateDoc(doc(db,"clientes",id), datos);
      // Si cambió el nombre, propagarlo a los potreros y recorridas ya cargados
      const nuevosPotreros = STORE.potreros.filter(p=>p.clienteId===id);
      for(const p of nuevosPotreros){
        if(p.clienteNombre !== nombre) await updateDoc(doc(db,"potreros",p.id), { clienteNombre: nombre });
      }
      const nuevasRec = STORE.recorridas.filter(r=>r.clienteId===id);
      for(const r of nuevasRec){
        if(r.clienteNombre !== nombre) await updateDoc(doc(db,"recorridas",r.id), { clienteNombre: nombre });
      }
    }else{
      await addDoc(collection(db,"clientes"), {...datos, createdAt: serverTimestamp()});
    }
    closeForm(); showToast(id?"Cliente actualizado":"Cliente guardado");
  }catch(e){ console.error(e); showToast("No se pudo guardar"); }
}

/* ==========================================================
   POTREROS
   ========================================================== */
function renderPotreros(){
  const filtro = document.getElementById("filtroClientePotreros").value;
  const lista = filtro ? STORE.potreros.filter(p=>p.clienteId===filtro) : STORE.potreros;
  const el = document.getElementById("potrerosList");
  if(lista.length===0){
    el.innerHTML = `<div class="empty"><b>No hay potreros para mostrar.</b>Tocá + para agregar uno (necesitás al menos un cliente cargado).</div>`;
    return;
  }
  el.innerHTML = lista.map(p=>{

async function guardarPotrero(){
  const id = document.getElementById("pt_id").value;
  const nombre = document.getElementById("pt_nombre").value.trim();
  const clienteId = document.getElementById("pt_cliente").value;
  if(!nombre){ showToast("Ingresá un nombre de potrero"); return; }
  const cliente = STORE.clientes.find(c=>c.id===clienteId);
  const datos = {
    clienteId, clienteNombre: cliente ? cliente.nombre : "",
    campo: document.getElementById("pt_campo").value.trim(),
    nombre, hectareas: parseFloat(document.getElementById("pt_ha").value)||0,
    cultivo: document.getElementById("pt_cultivo").value.trim(),
    notas: document.getElementById("pt_notas").value.trim()
  };
  try{
    if(id){
      await updateDoc(doc(db,"potreros",id), datos);
      // Propagar nombre de potrero / cliente / campo a las recorridas ya cargadas de este potrero
      const rec = STORE.recorridas.filter(r=>r.potreroId===id);
      for(const r of rec){
        await updateDoc(doc(db,"recorridas",r.id), {
          potreroNombre: nombre, clienteId, clienteNombre: datos.clienteNombre, campo: datos.campo
        });
      }
      closeForm(); showToast("Potrero actualizado");
    }else{
      await addDoc(collection(db,"potreros"), {...datos, createdAt: serverTimestamp()});
      closeForm(); showToast("Potrero guardado");
    }
  }catch(e){ console.error(e); showToast("No se pudo guardar"); }
}

async function guardarRecorrida(){
  const id = document.getElementById("rc_id").value;
  const btn = document.getElementById("rc_saveBtn");
  const datos = {
    potreroId: document.getElementById("rc_potreroId").value,
    fecha: document.getElementById("rc_fecha").value || todayStr(),
    estadoCultivo: document.getElementById("rc_estadoCultivo").value.trim(),
    prioridad: document.getElementById("rc_prioridad").value,
    estadoFenologico: document.getElementById("rc_estadoFenologico").value.trim(),
    requiereAplicacion: document.getElementById("rc_requiereAplicacion").value,
    problema: document.getElementById("rc_problema").value.trim(),
    situacionPotrero: document.getElementById("rc_situacion").value.trim(),
    recomendacion: document.getElementById("rc_recomendacion").value.trim(),
    autor: currentOperadorNombre(),
    updatedAt: serverTimestamp()
  };
  const p = STORE.potreros.find(x=>x.id===datos.potreroId);
  if(p){ datos.potreroNombre = p.nombre; datos.clienteId = p.clienteId; datos.clienteNombre = p.clienteNombre; datos.campo = p.campo||""; datos.cultivo = p.cultivo||""; }

  const fileInput = document.getElementById("rc_fotos");
  const files = fileInput.files;
  btn.textContent = "Guardando…";

  try{
    let docId = id;
    if(id){
      await updateDoc(doc(db,"recorridas",id), datos);
    }else{
      const nuevo = await addDoc(collection(db,"recorridas"), {...datos, fotos:[], enviado:false, ordenAplicacionId:null, createdAt: serverTimestamp()});
      docId = nuevo.id;
    }
    if(files && files.length>0){
      const urls = await subirFotos(files, docId);
      const existentes = id ? ((STORE.recorridas.find(r=>r.id===id)||{}).fotos||[]) : [];
      await updateDoc(doc(db,"recorridas",docId), { fotos: [...existentes, ...urls] });
    }
    closeForm();
    showToast(id?"Recorrida actualizada":"Recorrida guardada");
  }catch(e){
    console.error(e);
    showToast("No se pudo guardar (revisá fotos/conexión)");
    btn.textContent = id?"Guardar cambios":"Guardar recorrida";
  }
}

async function guardarOrden(){
  const id = document.getElementById("or_id").value;
  const recorridaId = document.getElementById("or_recorridaId").value;
  const rec = STORE.recorridas.find(r=>r.id===recorridaId);
  const p = STORE.potreros.find(x=>x.id===rec.potreroId);

  const productos = [];
  document.querySelectorAll("#productosOrdenWrap .prod-row-orden").forEach(row=>{
    const idx = row.dataset.idx;
    const ordenNum = parseInt(document.getElementById("po_orden_"+idx).value)||0;
    const nombre = document.getElementById("po_nombre_"+idx).value.trim();
    const dosis = parseFloat(document.getElementById("po_dosis_"+idx).value)||0;
    const unidad = document.getElementById("po_unidad_"+idx).value;
    if(nombre) productos.push({orden:ordenNum, nombre, dosis, unidad});
  });
  if(productos.length===0){ showToast("Cargá al menos un producto"); return; }
  productos.sort((a,b)=>a.orden-b.orden);

  const datos = {
    recorridaId, potreroId: rec.potreroId, potreroNombre: p.nombre,
    clienteId: p.clienteId, clienteNombre: p.clienteNombre, campo: p.campo||"",
    fechaRecomendada: document.getElementById("or_fechaRecomendada").value || rec.fecha,
    productos, observaciones: document.getElementById("or_observaciones").value.trim(),
    autor: currentOperadorNombre(), updatedAt: serverTimestamp()
  };

  try{
    if(id){
      await updateDoc(doc(db,"ordenesAplicacion",id), datos);
      closeForm(); showToast("Orden actualizada");
    }else{
      const nuevo = await addDoc(collection(db,"ordenesAplicacion"), {...datos, enviado:false, realizada:"", modificaciones:"", createdAt: serverTimestamp()});
      await updateDoc(doc(db,"recorridas",recorridaId), { ordenAplicacionId: nuevo.id });
      closeForm(); showToast("Orden de aplicación creada");
    }
  }catch(e){ console.error(e); showToast("No se pudo guardar"); }
}

      <div class="meta">Documento operativo derivado de la recorrida</div>
      <div class="meta" style="margin-top:8px;"><b>${o.clienteNombre}</b> — ${o.campo?o.campo+" · ":""}${o.potreroNombre}</div>
      ${rec?`<div class="meta">${rec.cultivo?rec.cultivo+" · ":""}Fecha de recorrida: ${fmtDate(rec.fecha)}</div>
      <div class="meta">${rec.prioridad?("Prioridad: "+rec.prioridad+" · "):""}${rec.estadoCultivo?("Estado: "+rec.estadoCultivo):""}</div>
      <div class="meta">${rec.estadoFenologico?("Fenología: "+rec.estadoFenologico+" · "):""}Requiere aplicación: ${rec.requiereAplicacion||"Sí"}</div>`:""}

      ${rec&&rec.problema?`<div class="bloque"><h3>1. Motivo de la intervención</h3><p>${rec.problema}</p></div>`:""}
      ${rec&&rec.situacionPotrero?`<div class="bloque"><h3>2. Diagnóstico de campo</h3><p>${rec.situacionPotrero}</p></div>`:""}
      ${rec&&rec.recomendacion?`<div class="bloque"><h3>3. Recomendación técnica</h3><p>${rec.recomendacion}</p></div>`:""}

      <div class="bloque">
        <h3>4. Datos operativos de la aplicación</h3>
        <p style="font-weight:600; margin-bottom:6px;">Fecha recomendada de aplicación: ${fmtDate(o.fechaRecomendada)}</p>
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <tr style="border-bottom:1px solid var(--line); font-weight:700;"><td>Orden</td><td>Producto</td><td>Dosis</td></tr>
          ${o.productos.map(pr=>`<tr style="border-bottom:1px solid var(--line);"><td style="padding:4px 0;">${pr.orden||"-"}</td><td>${pr.nombre}</td><td>${pr.dosis} ${pr.unidad}</td></tr>`).join("")}
        </table>
      </div>
      ${o.observaciones?`<div class="bloque"><h3>Observaciones</h3><p>${o.observaciones}</p></div>`:""}
      <div class="bloque">
        <h3>5. Condiciones de ejecución</h3>
        <p style="font-size:12px; color:#6B685A;">Verificar pronóstico, velocidad del viento, humedad relativa, temperatura, calibración del equipo, compatibilidad de mezclas, disponibilidad de agua y uso de elementos de protección personal.</p>
      </div>
    </div>

    <div class="section-divider" style="font-size:11px; font-weight:700; color:var(--sage); text-transform:uppercase; letter-spacing:.5px; margin:20px 0 10px;">Seguimiento de cumplimiento</div>
    <label class="field-label" style="margin-top:0;">¿Se realizó la aplicación?</label>
    <select id="oa_realizada">
      <option value="">Sin definir</option>
      <option value="Sí, según lo indicado" ${o.realizada==="Sí, según lo indicado"?"selected":""}>Sí, según lo indicado</option>
      <option value="Sí, con modificaciones" ${o.realizada==="Sí, con modificaciones"?"selected":""}>Sí, con modificaciones</option>
      <option value="No se realizó" ${o.realizada==="No se realizó"?"selected":""}>No se realizó</option>
    </select>
    <label class="field-label">Modificaciones respecto a lo indicado (si aplica)</label>
    <textarea id="oa_modificaciones" placeholder="Detallá qué se cambió respecto a la recomendación">${o.modificaciones||""}</textarea>
    <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="guardarSeguimientoOrden('${ordenId}')">Guardar seguimiento</button>

    <div style="margin-top:14px;">
      ${o.enviado
        ? `<div class="hint" style="color:var(--sage); font-weight:700; font-size:12.5px;">✔ Enviada al cliente el ${fmtDate(o.enviadoFecha)}</div>`
        : `<button class="btn btn-outline btn-block" onclick="marcarEnviado('ordenesAplicacion','${ordenId}')">✔ Marcar orden como enviada al cliente</button>`}
    </div>
  `;
  document.getElementById("formOverlay").classList.add("show");
}

function guardarSeguimientoOrden(ordenId){
  const realizada = document.getElementById("oa_realizada").value;
  const modificaciones = document.getElementById("oa_modificaciones").value.trim();
  updateDoc(doc(db,"ordenesAplicacion",ordenId), { realizada, modificaciones })
    .then(()=>showToast("Seguimiento guardado"))
    .catch(e=>{ console.error(e); showToast("No se pudo guardar"); });
}

/* ==========================================================
   HISTORIAL GLOBAL (buscador / filtro)
   ========================================================== */
function renderHistorial(){
  const clienteId = document.getElementById("filtroClienteHist").value;
  const potreroId = document.getElementById("filtroPotreroHist").value;
  let lista = STORE.recorridas;
  if(clienteId) lista = lista.filter(r=>r.clienteId===clienteId);
  if(potreroId) lista = lista.filter(r=>r.potreroId===potreroId);

  const el = document.getElementById("historialList");
  if(lista.length===0){
    el.innerHTML = `<div class="empty"><b>No hay recorridas para este filtro.</b></div>`;
    return;
  }
  el.innerHTML = lista.map(r=>`
    <div class="card" onclick="verInforme('${r.id}')">
      <b>${r.clienteNombre} — ${r.potreroNombre} ${r.enviado?"✔":""}</b>
      <div class="sub">${fmtDate(r.fecha)}${r.estadoFenologico?(" · "+r.estadoFenologico):""}</div>
      <div class="meta">${(r.recomendacion||"").slice(0,80)}${(r.recomendacion||"").length>80?"…":""}</div>
    </div>
  `).join("");
}

/* cerrar modal tocando el fondo */
document.getElementById("formOverlay").addEventListener("click", e=>{ if(e.target.id==="formOverlay") closeForm(); });

renderClientes();

Object.assign(window, {
  mostrarTab, hacerLogin, hacerRegistro, cerrarSesion, showView, fabAction,
  verPotrerosDeCliente, abrirFormCliente, guardarCliente,
  abrirFormPotrero, guardarPotrero, verPotrero,
  abrirFormRecorrida, guardarRecorrida, verInforme, closeForm, renderPotreros, renderHistorial,
  marcarEnviado, abrirFormOrden, guardarOrden, verOrdenAplicacion, agregarFilaProductoOrden, guardarSeguimientoOrden
});
</script>
</body>
</html>
